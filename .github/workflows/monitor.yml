name: vix-monitor

# 每 10 分钟检查一次;仅当 VIX > 30 时才真正推送,其余只更新状态
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      test_push:
        description: "发送一条测试消息(忽略阈值,用于验证推送渠道)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: vix-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Check & push
        env:
          # 密钥存在仓库 Settings → Secrets 里,不写进代码
          VIX_SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          VIX_PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          # 想改阈值就在 Settings → Variables 里加一个 VIX_ALERT_ABOVE=25,不用改代码
          VIX_ALERT_ABOVE: ${{ vars.VIX_ALERT_ABOVE }}
        run: |
          if [ "${{ inputs.test_push }}" = "true" ]; then
            python main.py test --force
          else
            python main.py run
          fi

      - name: Persist state
        run: |
          git config user.name "blip58"
          git config user.email "301173563+blip58@users.noreply.github.com"
          # test --force 之类的运行不会写 state.json,此时直接跳过
          [ -f state.json ] || { echo "no state.json this run"; exit 0; }
          git add state.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: state [skip ci]" -m "Co-authored-by: glm5.3 <glm5.3@users.noreply.github.com>"
          # 推送失败(并发运行导致分支前进)时重试,状态以本次运行为准
          set +e
          for i in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase -X theirs origin "${{ github.ref_name }}" || git rebase --abort
          done
          echo "state push failed after retries (not fatal)"
          exit 0
